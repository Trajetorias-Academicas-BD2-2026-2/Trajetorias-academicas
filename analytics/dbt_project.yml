name: ofertas_unb
version: '1.0'
config-version: 2

profile: ofertas_unb

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  ofertas_unb:
    staging:
      +materialized: view
    marts:
      +materialized: table
    ml:
      +materialized: view
    semantic:
      +materialized: table

# E4: o dbt recria as tabelas de consumo; reaplica RLS e grants (V012) ao fim de cada execução.
on-run-end:
  - "select operations.aplicar_acesso_analytics()"
