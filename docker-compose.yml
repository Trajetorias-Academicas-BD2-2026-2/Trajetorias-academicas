x-pg-env: &pg-env
  PGHOST: db
  PGUSER: g2
  PGDATABASE: ofertas_unb
  PGPASSWORD: g2_dev_only

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ofertas_unb
      POSTGRES_USER: g2
      POSTGRES_PASSWORD: g2_dev_only
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g2 -d ofertas_unb"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment: *pg-env
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    entrypoint: ["bash", "/migrate.sh"]

  loader:
    build: ./loader
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_NAME: ofertas_unb
      DB_USER: g2
      DB_PASSWORD: g2_dev_only
      SIGAA_UNIDADE: "CAMPUS UNB GAMA: FACULDADE DE CIÊNCIAS E TECNOLOGIAS EM ENGENHARIA - BRASÍLIA"
      # Recorte: semestres encerrados, inclusive (o loader recusa semestre em andamento)
      SIGAA_SEMESTRE_INICIO: "2022.1"
      SIGAA_SEMESTRE_FIM: "2026.1"
      # auto: raspa só o que falta em data/raw | 1: raspa tudo de novo | 0: nunca raspa
      RASPAR: ${RASPAR:-auto}
      DATA_DIR: /app/data/raw
      DEBUG_DIR: /app/debug
    volumes:
      - ./data:/app/data
      - ./debug:/app/debug
      - ./db/consultas:/app/consultas:ro

  # Testes de dados pós-carga: docker compose run --rm tests
  tests:
    image: postgres:16
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment: *pg-env
    volumes:
      - ./tests:/tests:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-X", "-f", "/tests/sanity_checks.sql"]

volumes:
  db_data:
