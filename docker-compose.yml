x-pg-env: &pg-env
  PGHOST: db
  PGUSER: g2
  PGDATABASE: ofertas_unb
  PGPASSWORD: g2_dev_only

services:
  db:
    # Postgres 16 oficial + extensão pgvector (camada vetorial, V009).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ofertas_unb
      POSTGRES_USER: g2
      POSTGRES_PASSWORD: g2_dev_only
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g2 -d ofertas_unb"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment: *pg-env
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    entrypoint: ["bash", "/migrate.sh"]

  loader:
    build: ./loader
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_NAME: ofertas_unb
      DB_USER: g2
      DB_PASSWORD: g2_dev_only
      # Lote versionado a carregar (pasta com SHA256SUMS.txt)
      DATA_DIR: /app/data/coleta_publica_2026-09-28
      # Datas oficiais de encerramento de cada semestre (SAA/UnB)
      CALENDARIO: /app/data/calendario_academico.csv
      # Recorte esperado no lote: semestres encerrados, inclusive
      SEMESTRE_INICIO: "2022.1"
      SEMESTRE_FIM: "2026.1"
      DEBUG_DIR: /app/debug
      CONSULTAS_DIR: /app/consultas
    volumes:
      - ./data:/app/data
      - ./debug:/app/debug
      - ./db/consultas:/app/consultas:ro

  # Testes de dados pós-carga: docker compose run --rm tests
  tests:
    image: postgres:16
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment: *pg-env
    volumes:
      - ./tests:/tests:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-X", "-f", "/tests/sanity_checks.sql"]

  analytics-tests:
    image: postgres:16
    profiles: ["test"]
    depends_on:
      analytics:
        condition: service_completed_successfully
    environment: *pg-env
    volumes:
      - ./tests:/tests:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-X", "-f", "/tests/analytics_checks.sql"]

  e2-batch:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    profiles: ["e2"]
    command:
      - python
      - ingestion/batch_to_delta.py
      - --source
      - data/coleta_publica_2026-09-28/ofertas_por_curso.csv
      - --output
      - analytical/batch/ofertas
    volumes:
      - .:/workspace
    working_dir: /workspace

  e2-cdc:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    profiles: ["e2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *pg-env
    command:
      - python
      - ingestion/cdc_consumer.py
      - --output
      - analytical/cdc/reservas
    volumes:
      - .:/workspace
    working_dir: /workspace

  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    depends_on:
      loader:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: g2
      PGDATABASE: ofertas_unb
      PGPASSWORD: g2_dev_only
      DBT_ALLOW_EXPERIMENTAL_ADAPTERS: "true"
    command: ["bash", "/workspace/analytics/run.sh"]
    volumes:
      - .:/workspace
    working_dir: /workspace

  # Camada vetorial (P12): docker compose --profile ml run --rm ml
  # Vetoriza só textos novos de analytics.ml_stg_texto; o modelo fica no volume.
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    profiles: ["ml"]
    depends_on:
      analytics:
        condition: service_completed_successfully
    environment:
      <<: *pg-env
      MODELO_DIR: /modelos
    volumes:
      - ml_modelos:/modelos

  # Checagens da camada vetorial (P13): docker compose --profile ml run --rm ml-tests
  ml-tests:
    image: postgres:16
    profiles: ["ml"]
    depends_on:
      ml:
        condition: service_completed_successfully
    environment: *pg-env
    volumes:
      - ./tests:/tests:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-X", "-f", "/tests/ml_checks.sql"]

  dashboard:
    build: ./dashboard
    depends_on:
      analytics:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: g2
      PGDATABASE: ofertas_unb
      PGPASSWORD: g2_dev_only
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  db_data:
  ml_modelos:
